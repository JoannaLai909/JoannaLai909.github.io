<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JavaScript Object Properties</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        h2 {
            color: darkblue;
        }

        .box {
            background-color: #f2f2f2;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h2>Original Object Properties</h2>
    <div class="box" id="before"></div>

    <h2>Object After Deleting Age Property</h2>
    <div class="box" id="after"></div>

    <script>
        // Create object
        var Person = {
            firstName: "Tony",
            lastName: "Lee",
            age: 50,
            eyeColor: "Blue"
        };

        // Show all properties
        let beforeText = "";

        for (let key in Person) {
            beforeText += key + " : " + Person[key] + "<br>";
        }

        document.getElementById("before").innerHTML = beforeText;

        // Delete age property
        delete Person.age;

        // Show object after deleting
        let afterText = "";

        for (let key in Person) {
            afterText += key + " : " + Person[key] + "<br>";
        }

        document.getElementById("after").innerHTML = afterText;
    </script>

</body>
</html>
