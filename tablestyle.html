<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table and Fixed Div</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #e9e9e9;
    }

    .wrapper {
      width: 780px;
      margin: 90px auto;
      background: #f5f5f5;
      border: 1px solid #d7d7d7;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.15);
      padding: 45px 35px;
      position: relative;
      min-height: 260px;
    }

    table {
      border-collapse: collapse;
      width: 290px;
      font-size: 22px;
    }

    th,
    td {
      border: 2px solid #333;
      padding: 14px 14px;
      text-align: left;
    }

    th {
      background: #8e939c;
      color: white;
      font-weight: bold;
      font-size: 20px;
    }

    .yellow {
      background: #fff600;
    }

    .white {
      background: #ffffff;
    }

    .fixed-box {
      position: fixed;
      top: 140px;
      right: 120px;
      width: 145px;
      min-height: 145px;
      border: 4px solid #66a80f;
      background: white;
      padding: 8px;
      font-size: 20px;
      line-height: 1.15;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table>
      <tr>
        <th>Firstname</th>
        <th>Lastname</th>
      </tr>
      <tr class="yellow">
        <td>1</td>
        <td>1</td>
      </tr>
      <tr class="white">
        <td>2</td>
        <td>2</td>
      </tr>
      <tr class="yellow">
        <td>3</td>
        <td>3</td>
      </tr>
    </table>
  </div>

  <div class="fixed-box">
    This div<br />
    element has<br />
    position: fixed;
  </div>
</body>
</html>
