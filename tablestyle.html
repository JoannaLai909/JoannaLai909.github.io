<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table and Fixed Div</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #e9e9e9;
    }

    /* 外框 */
    .outer-box {
      width: 820px;
      margin: 80px auto;
      background: #eeeeee;
      border: 1px solid #cfcfcf;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      padding: 40px;
      position: relative;
    }

    .content {
      display: flex;
      justify-content: space-between;
    }

    table {
      border-collapse: collapse;
      width: 300px;
      font-size: 22px;
    }

    th, td {
      border: 2px solid #333;
      padding: 14px;
      text-align: left;
    }

    th {
      background: #8e939c;
      color: white;
    }

    .yellow { background: #fff600; }
    .white { background: #ffffff; }

    /* 重點：fixed 但寫在 outer-box 裡面 */
    .fixed-box {
      position: fixed;
      /* fixed 仍然是相對於視窗，所以要手動算到外框內側 */
      top: 95px;
      right: calc((100vw - 900px) / 2 + 35px);
      width: 160px;
      height: 160px;
      border: 4px solid #66a80f;
      background: white;
      padding: 10px;
      font-size: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="outer-box">

    <div class="content">

      <!-- table -->
      <table>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
        </tr>
        <tr class="yellow">
          <td>1</td>
          <td>1</td>
        </tr>
        <tr class="white">
          <td>2</td>
          <td>2</td>
        </tr>
        <tr class="yellow">
          <td>3</td>
          <td>3</td>
        </tr>
      </table>

    </div>

    <!-- 放在外框裡面（但仍然 fixed） -->
    <div class="fixed-box">
      This div<br>
      element has<br>
      position: fixed;
    </div>

  </div>

</body>
</html>
