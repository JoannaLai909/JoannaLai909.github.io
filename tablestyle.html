<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table and Fixed Div</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #e9e9e9;
    }

    /* 外框（題目要求的框框） */
    .outer-box {
      width: 820px;
      margin: 80px auto;
      background: #eeeeee;
      border: 1px solid #cfcfcf;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      padding: 40px;
      position: relative;
    }

    /* 內容區：table + 右邊空間 */
    .content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    table {
      border-collapse: collapse;
      width: 300px;
      font-size: 22px;
    }

    th, td {
      border: 2px solid #333;
      padding: 14px;
      text-align: left;
    }

    th {
      background: #8e939c;
      color: white;
    }

    .yellow {
      background: #fff600;
    }

    .white {
      background: #ffffff;
    }

    /* 右上固定框 */
    .fixed-box {
      position: fixed;
      top: 120px;
      right: 120px;
      width: 160px;
      height: 160px;
      border: 4px solid #66a80f;
      background: white;
      padding: 10px;
      font-size: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- 外框 -->
  <div class="outer-box">

    <div class="content">

      <!-- Table -->
      <table>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
        </tr>
        <tr class="yellow">
          <td>1</td>
          <td>1</td>
        </tr>
        <tr class="white">
          <td>2</td>
          <td>2</td>
        </tr>
        <tr class="yellow">
          <td>3</td>
          <td>3</td>
        </tr>
      </table>

    </div>

  </div>

  <!-- 固定在右上角的div（不在外框裡，因為是fixed） -->
  <div class="fixed-box">
    This div<br>
    element has<br>
    position: fixed;
  </div>

</body>
</html>
