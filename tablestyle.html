<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table and Fixed Div</title>
  <style>
    body {
      margin: 0;
      background: #e9e9e9;
      font-family: "Times New Roman", serif;
    }

    /* 外面的大框 */
    .outer-box {
      width: 820px;
      margin: 60px auto;
      padding: 50px;
      background: #efefef;
      border: 1px solid #cfcfcf;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* 左右排版 */
    .content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    /* 表格 */
    table {
      border-collapse: collapse;
      width: 400px;
    }

    th, td {
      border: 3px solid #444;
      padding: 15px 16px;
      text-align: left;
    }

    th {
      background: #9ea3ab;
      color: white;
      font-size: 28px;
      font-weight: bold;
    }

    td {
      font-size: 22px;
      height: 44px;
    }

    .yellow {
      background: #fff600;
    }

    .white {
      background: #ffffff;
    }

    /* 先佔位置，讓左右看起來有同高度區域 */
    .box-placeholder {
      width: 180px;
      height: 240px;
      visibility: hidden;
      flex-shrink: 0;
    }

    /* 真正的 fixed 綠色框 */
    .fixed-box {
      position: fixed;
      top: 115px;
      right: calc((100vw - 940px) / 2 + 60px);
      width: 180px;
      height: 240px;
      border: 5px solid #6aa80f;
      background: white;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 28px;
      line-height: 1.2;
    }
  </style>
</head>
<body>

  <div class="outer-box">
    <div class="content">
      <table>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
        </tr>
        <tr class="yellow">
          <td>1</td>
          <td>1</td>
        </tr>
        <tr class="white">
          <td>2</td>
          <td>2</td>
        </tr>
        <tr class="yellow">
          <td>3</td>
          <td>3</td>
        </tr>
      </table>

      <div class="box-placeholder"></div>
    </div>

    <div class="fixed-box">
      This div<br>
      element has<br>
      position:<br>
      fixed;
    </div>
  </div>

</body>
</html>
