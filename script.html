<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Interaction with Border</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      border: 2px solid gray;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      background-color: white;
    }
    #message {
      font-size: 24px;
      margin-bottom: 20px;
    }
    #button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="message">Hello</div>
    <button id="button" onmouseover="changeTextColor('red')" onclick="changeTextColorOnClick()">Button</button>
    <p>Try: Mouse over the button (hover) to change the text and color. Click the button to change again.</p>
  </div>

  <script>
    // Change text color on mouse over
    function changeTextColor(color) {
      document.getElementById('message').style.color = color;
    }

    // Change text content and color on button click
    function changeTextColorOnClick() {
      document.getElementById('message').innerHTML = "Mouse Click";
      document.getElementById('message').style.color = "magenta";
    }
  </script>
</body>
</html>
