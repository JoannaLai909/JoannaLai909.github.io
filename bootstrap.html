<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Practice</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <style>
    /* 讓 badge 更圓（比 badge-pill 更接近設計稿） */
    .custom-badge{
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container mt-4">

  <!-- Jumbotron -->
  <div class="jumbotron text-center">
    <h1>My First Bootstrap Page</h1>
  </div>

  <!-- Input -->
  <div class="form-group">
    <label>Input:</label>
    <input type="text" class="form-control">
  </div>

  <!-- Alert -->
  <div class="alert alert-success">
    Successful alert
  </div>

  <!-- Button + Badge（分開） -->
  <button class="btn btn-secondary mr-2">Button</button>
  <span class="badge badge-secondary custom-badge">badge</span>

</div>

</body>
</html>
