<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debugger Console Example</title>
</head>
<body>
  <h1>Welcome to the Debugger Console Example</h1>

  <script>
    // This will show "Hello JavaScript" in the console as soon as the page loads
    window.onload = function() {
      console.log("Hello JavaScript");
    }
  </script>
</body>
</html>
