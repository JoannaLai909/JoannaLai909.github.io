<!DOCTYPE html>
<html>
<head>
<style>
.one{
  border-style:double;
  border-width: 5px;
  border-color:red;
  background-color: lightblue;
}
.two{
  border-style:solid;
  border-width:medium;
  border-color:blue;
  border-radius: 5px;
  background-color: yellow;
}
.three{
  border-style:dotted;
  border-width: 5px;
  border-color: purple;
  background-color: green;
</style>
<body>
  <h1 class="one">Hello World</h1>
  <h1 class="two">Hello World</h1>
  <h1 class="three">Hello World</h1>
</body>
</head>
</html>
