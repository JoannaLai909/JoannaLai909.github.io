<!DOCTYPE html>
<html>
<head>
<style>
.box{
  border: 2px solid black;
  width: 400px;
  padding: 15px;
  box-shadow: 5px 5px 5px 5px gray;
.one{
  border-style:double;
  border-width: 8px;
  border-color:red;
  background-color: lightblue;
}
.two{
  border-style:solid;
  border-width:medium;
  border-color:blue;
  border-radius: 5px;
  background-color: yellow;
}
.three{
  border-style:dotted;
  border-width: 10px;
  border-color: purple;
  background-color: green;
</style>
<body>
  <div class="box">
  <h1 class="one">Hello World</h1>
  <h1 class="two">Hello World</h1>
  <h1 class="three">Hello World</h1>
</body>
</head>
</html>
