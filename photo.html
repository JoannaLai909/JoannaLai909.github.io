<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perfect Touch Layout</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:40px;
  background:#f2f2f2;
}

/* 容器 */
.container{
  width:1100px;
  margin:0 auto;
  display:flex;
  align-items:center;
}

/* 左右圖（扣掉圓） */
.left, .right{
  width:calc((100% - 150px) / 2);  /* ⭐關鍵 */
}

/* 左圖 */
.left img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:18px;
  display:block;
}

/* 右圖 */
.right img{
  width:100%;
  height:300px;
  object-fit:fill;
  display:block;
}

/* 圓 */
.circle{
  width:150px;
  height:150px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid #777;
  background:#fff;
  flex-shrink:0;   /* ⭐避免被壓縮 */
}

.circle img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
</style>

</head>

<body>

<div class="container">

  <div class="left">
    <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785">
  </div>

  <div class="circle">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
  </div>

  <div class="right">
    <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785">
  </div>

</div>

</body>
</html>
