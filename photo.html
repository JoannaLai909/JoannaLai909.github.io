<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS Image Styling</title>

<style>
body{
  margin:0;
  padding:40px;
  background:#f2f2f2;
}

/* 外層 */
.container{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 左右圖片 */
.left, .right{
  width:33%;
}

/* 左圖（不變形） */
.left img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:18px;
  margin-right:-75px;   /* ⭐關鍵：相切 */
}

/* 右圖（故意變形） */
.right img{
  width:100%;
  height:300px;
  object-fit:fill;
  margin-left:-75px;    /* ⭐關鍵：相切 */
}

/* 中間圓 */
.circle{
  width:150px;
  height:150px;
  border-radius:50%;
  border:3px solid #666;
  overflow:hidden;
  z-index:2;
}

.circle img{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>

</head>

<body>

<div class="container">

  <div class="left">
    <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a">
  </div>

  <div class="circle">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
  </div>

  <div class="right">
    <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a">
  </div>

</div>

</body>
</html>
