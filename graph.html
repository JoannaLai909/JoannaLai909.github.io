<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      position: relative;
      width: 300px;
      height: 250px;
    }

    .rectangle {
      width: 200px;
      height: 150px;
      background-color: blue;
      border: 5px solid black;
      position: absolute;
      top: 50px;
      left: 50px;
    }

    .circle {
      width: 120px;
      height: 120px;
      background-color: yellow;
      border-radius: 50%;
      border: 6px solid red;
      position: absolute;
      top: 65px;   
      left: 170px; 
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="rectangle"></div>
    <div class="circle"></div>
  </div>

</body>
</html>
