<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片資訊展開實作</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif, '微軟正黑體';
            padding: 40px;
            background-color: #f6f6f6;
            display: flex;
            justify-content: center; /* 將區塊置中方便查看 */
        }

        /* 外層容器，設定與設計圖相近的寬度 */
        .card-container {
            width: 496px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 1px solid #eaeaec;
        }

        /* 頂部區域：放置按鈕 */
        .card-header {
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end; /* 將按鈕推到右邊 */
            border-bottom: 1px solid #eaeaec;
        }

        /* 按鈕樣式 (沿用之前的設計規範) */
        .spec-button {
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            font-size: 13px;
            color: #2f2f2f;
            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            height: 22px;
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s;
        }

        .spec-button:hover {
            background-color: #f0f0f0;
        }

        /* 圖片容器 */
        .image-area {
            width: 100%;
            display: block;
        }

        .image-area img {
            width: 100%;
            height: auto;
            display: block; /* 移除圖片底部的空白間隙 */
        }

        /* 資訊面板 (預設隱藏) */
        .info-panel {
            display: none; /* 預設不顯示 */
            background-color: #ffffff;
            border-top: 1px solid #eaeaec;
        }

        /* 資訊面板展開時的 class */
        .info-panel.active {
            display: block; 
        }

        /* 模擬設計圖上的綠色資訊條列 */
        .info-row {
            padding: 6px 20px;
            font-size: 12px;
            color: #555;
            background-color: #a3f2a3; /* 模擬右下角的淺綠色底色 */
            border-bottom: 1px solid #ffffff;
            word-break: break-all; /* 讓過長的路徑可以換行 */
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card-header">
            <button id="toggleBtn" class="spec-button">查看資訊</button>
        </div>

        <div class="image-area">
            <img src="https://picsum.photos/496/240" alt="風景預覽圖">
        </div>

        <div id="infoPanel" class="info-panel">
            <div class="info-row">修改日期： 2017/10/12</div>
            <div class="info-row">類別： JPG</div>
            <div class="info-row">大小： 456.97KB</div>
            <div class="info-row">路徑： \\designcenter.qnap.com.tw\DesignCenter\PM\RD...</div>
        </div>
    </div>

    <script>
        // 取得按鈕與資訊面板的 HTML 元素
        const toggleBtn = document.getElementById('toggleBtn');
        const infoPanel = document.getElementById('infoPanel');

        // 監聽按鈕的點擊事件
        toggleBtn.addEventListener('click', function() {
            // 切換 'active' 這個 class，用來控制顯示或隱藏
            infoPanel.classList.toggle('active');

            // 根據面板是否顯示，來改變按鈕的文字
            if (infoPanel.classList.contains('active')) {
                toggleBtn.textContent = '收起資訊';
            } else {
                toggleBtn.textContent = '查看資訊';
            }
        });
    </script>

</body>
</html>
