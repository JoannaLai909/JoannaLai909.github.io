<!DOCTYPE html>
<html>
<head> 
<style>
  .heading1{
    text-decoration: overline;
    text-align: left;
    font-style: normal;
    font-size: 40px;
    text-shadow: 2px 2px pink;
    margin-top: 0;
    
  }
  .heading2{
    font-style: italic;
    font-size:30px;
    border: 1px solid black;
    outline-style: outset;
    outline: thick ridge yellow;
    outline-width: 4px;
    outline-shadow: 0 2px;
    padding: 5px
  }
  .heading3{
    text-decoration: underline;
    font-size:20px;
    text-align: right;
    font-style: normal;
    margin-bottom: 0;
  }
  .box{
    width:450px;
    padding:15px;
    box-shadow: 0 0 15px 2px gray;
  }
</style>
</head>
  <body>
    <div class="box">
    <h1 class="heading1">This is heading 1</h1>
    <h2 class="heading2">This is heading 2</h2>
    <h3 class="heading3">This is heading 3</h3>
    </div>
  </body>
</html>
