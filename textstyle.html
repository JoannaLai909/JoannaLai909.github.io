<!DOCTYPE html>
<html>
<head> 
<style>
  .heading1{
    text-decoration: overline;
    text-align: left;
    font-style: normal;
    font-size: 40px;
    text-shadow: 2px 2px pink;
    
  }
  .heading2{
    font-style: italic;
    font-size:30px;
    border: 1px solid black;
    outline: thick ridge yellow;
    outline-style: outset;
    outline-width: 4px;
    outline-shadow: 0 2px gray; 
  }
  .heading3{
    text-decoration: underline;
    font-size:20px;
    text-align: right;
    font-style: normal;
  }
  .box{
    border: 2px solid black;
    width:600px
    padding:15px;
    box-shadow: 0 0 15px 2px gray;
</style>
</head>
  <body>
    <div class="box">
    <p class="heading1">This is heading 1</p>
    <p class="heading2">This is heading 2</p>
    <p class="heading3">This is heading 3</p>
    </div>
  </body>
</html>
